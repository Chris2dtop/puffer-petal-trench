<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="1060" viewBox="0 0 2480 1060"><style>.t{font:700 20px Helvetica,Arial;fill:#111;letter-spacing:2px}.s{font:400 14px Helvetica,Arial;fill:#444}.l{font:600 13px Helvetica,Arial;fill:#111}
.sh{fill:#2b2b2d;stroke:#111;stroke-width:2}.ln{fill:#6b6b70;stroke:#111;stroke-width:1.2}.fi{fill:#e9e6df;stroke:#999;stroke-width:1;stroke-dasharray:3 2}
.st{fill:none;stroke:#c0392b;stroke-width:2;stroke-dasharray:5 3}.ar{stroke:#111;stroke-width:1.2;fill:none;marker-end:url(#a)}.snap{fill:#141414;stroke:#888;stroke-width:1.4}
.zip{stroke:#bbb;stroke-width:5;stroke-dasharray:2 2}.box{fill:#fff;stroke:#d8d4cc}.dim{stroke:#c0392b;stroke-width:1.6;fill:none;marker-start:url(#d);marker-end:url(#d)}.dt{font:700 14px Helvetica,Arial;fill:#c0392b}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#111"/></marker>
<marker id="d" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker></defs><rect width="2480" height="1060" fill="#f4f3f0"/><g transform="translate(20,20)"><rect class="box" width="1200" height="600" rx="8"/><text class="t" x="18" y="32">A · PETAL POD</text><text class="s" x="18" y="54">How each pod is made and attached</text><g transform="translate(40,80)">
<path class="sh" d="M150,-20 C215,10 240,50 240,80 C240,130 185,180 150,225 C115,180 60,130 60,80 C60,50 85,10 150,-20 Z"/>
<path class="st" d="M70,80 C70,50 95,18 150,-8 C205,18 230,50 230,80"/>
<path class="ar" d="M290,6 L200,20"/><text class="l" x="294" y="10" text-anchor="start">attach seam: upper edges only (top ~40 %)</text><path class="ar" d="M290,200 L150,200"/><text class="l" x="294" y="204" text-anchor="start">free tip (floats, not sewn)</text><path class="ar" d="M290,104 L240,100"/><text class="l" x="294" y="108" text-anchor="start">filled: shell both faces, ≈5.2 g fill at M</text>
<g transform="translate(0,250)"><text class="l" x="0" y="0">Section through 3 rows (side view)</text>
<path class="ln" d="M0,150 L520,150 L520,162 L0,162 Z"/><text class="s" x="0" y="185">base: shell + lining, channel-quilted (warmth without the pods)</text>
<path class="sh" d="M40,142 q60,-70 150,-16 q-30,22 -150,16 z" transform="rotate(-12 40 142)"/><circle cx="44" cy="141" r="4" fill="#c0392b"/><path class="sh" d="M190,142 q60,-70 150,-16 q-30,22 -150,16 z" transform="rotate(-12 190 142)"/><circle cx="194" cy="141" r="4" fill="#c0392b"/><path class="sh" d="M340,142 q60,-70 150,-16 q-30,22 -150,16 z" transform="rotate(-12 340 142)"/><circle cx="344" cy="141" r="4" fill="#c0392b"/>
<path class="ar" d="M120,60 L80,120"/><text class="l" x="126" y="58">each row covers the attach seam of the row below by PO = 15 cm</text></g></g></g><g transform="translate(1260,20)"><rect class="box" width="1200" height="340" rx="8"/><text class="t" x="18" y="32">B · STORM FLAP + SNAPS</text><text class="s" x="18" y="54">Centre-front closure</text><g transform="translate(40,90)"><text class="l" x="0" y="0">Horizontal section at a snap</text>
<path class="sh" d="M0,90 L230,90 L230,104 L0,104 Z"/><path class="sh" d="M250,90 L480,90 L480,104 L250,104 Z"/>
<line class="zip" x1="226" y1="97" x2="254" y2="97"/>
<path class="sh" d="M200,60 L330,60 Q342,60 342,72 L342,78 L200,78 Z"/>
<rect x="300" y="78" width="22" height="12" class="snap"/><rect x="300" y="104" width="22" height="8" class="snap"/>
<path class="ar" d="M360,150 L240,97"/><text class="l" x="364" y="154" text-anchor="start">METAL #5 two-way zip, gunmetal</text><path class="ar" d="M360,30 L270,62"/><text class="l" x="364" y="34" text-anchor="start">storm flap 8 cm, 2 layers + fusible edge</text><path class="ar" d="M470,120 L311,84"/><text class="l" x="474" y="124" text-anchor="start">gunmetal ring-spring snap 15 mm (9 + 1)</text>
<text class="s" x="0" y="190">The flap runs the FULL length, collar to hem. No zip teeth visible outside.</text>
<text class="s" x="0" y="210">Snap spacing SN = 13 cm (M); top snap on the collar tab. Zip guard + chin guard behind the zip.</text></g></g><g transform="translate(1260,380)"><rect class="box" width="590" height="400" rx="8"/><text class="t" x="18" y="32">C · CUFF</text><text class="s" x="18" y="54">Balloon sleeve into band</text><g transform="translate(40,90)"><path class="sh" d="M20,20 Q0,100 40,150 L200,150 Q240,100 220,20 Z"/>
<path class="sh" d="M40,150 L40,184 L200,184 L200,150 Z"/><path d="M60,150 l-6,-22" stroke="#888" stroke-width="1.2"/><path d="M88,150 l-6,-22" stroke="#888" stroke-width="1.2"/><path d="M116,150 l-6,-22" stroke="#888" stroke-width="1.2"/><path d="M144,150 l-6,-22" stroke="#888" stroke-width="1.2"/><path d="M172,150 l-6,-22" stroke="#888" stroke-width="1.2"/><path d="M200,150 l-6,-22" stroke="#888" stroke-width="1.2"/>
<path d="M70,184 L70,214 L170,214 L170,184" fill="#4a4a4e" stroke="#111" stroke-width="1.6"/><line x1="76" y1="186" x2="76" y2="212" stroke="#222" stroke-width="1"/><line x1="85" y1="186" x2="85" y2="212" stroke="#222" stroke-width="1"/><line x1="94" y1="186" x2="94" y2="212" stroke="#222" stroke-width="1"/><line x1="103" y1="186" x2="103" y2="212" stroke="#222" stroke-width="1"/><line x1="112" y1="186" x2="112" y2="212" stroke="#222" stroke-width="1"/><line x1="121" y1="186" x2="121" y2="212" stroke="#222" stroke-width="1"/><line x1="130" y1="186" x2="130" y2="212" stroke="#222" stroke-width="1"/><line x1="139" y1="186" x2="139" y2="212" stroke="#222" stroke-width="1"/><line x1="148" y1="186" x2="148" y2="212" stroke="#222" stroke-width="1"/><line x1="157" y1="186" x2="157" y2="212" stroke="#222" stroke-width="1"/><line x1="166" y1="186" x2="166" y2="212" stroke="#222" stroke-width="1"/>
<path class="ar" d="M250,140 L200,166"/><text class="l" x="254" y="144" text-anchor="start">cuff band 6 cm, gathered</text><path class="ar" d="M250,205 L170,200"/><text class="l" x="254" y="209" text-anchor="start">inner rib storm cuff (8 cm)</text></g></g><g transform="translate(1870,380)"><rect class="box" width="590" height="400" rx="8"/><text class="t" x="18" y="32">D · COLLAR + POCKET</text><text class="s" x="18" y="54">Collar faced with brushed tricot; pocket bag lined</text><g transform="translate(40,90)"><path class="sh" d="M30,150 L45,30 Q120,20 195,30 L210,150 Q120,165 30,150 Z"/>
<path d="M40,110 L200,110 M46,70 L194,70" stroke="#8a8a8f" stroke-dasharray="5 4" fill="none"/><path class="sh" d="M195,40 L240,40 L240,80 L200,80 Z"/><circle class="snap" cx="226" cy="60" r="6"/>
<path class="ar" d="M270,40 L232,60"/><text class="l" x="274" y="44" text-anchor="start">collar tab + snap</text><path class="ar" d="M270,130 L120,140"/><text class="l" x="274" y="134" text-anchor="start">funnel 11 cm, 2 channels</text>
<g transform="translate(0,190)"><path class="sh" d="M0,0 L240,0 L240,90 L0,90 Z"/><path d="M150,10 L138,82" stroke="#ddd" stroke-width="4" stroke-linecap="round"/><path d="M150,10 L120,10 L104,82 L138,82" fill="none" stroke="#c0392b" stroke-dasharray="4 3"/>
<path class="ar" d="M270,30 L146,40"/><text class="l" x="274" y="34" text-anchor="start">METAL #5 gunmetal zip, 18 cm</text><path class="ar" d="M270,70 L115,60"/><text class="l" x="274" y="74" text-anchor="start">lined bag (brushed tricot)</text></g></g></g><g transform="translate(20,640)"><rect class="box" width="1200" height="400" rx="8"/><text class="t" x="18" y="32">E · QUILTING</text><text class="s" x="18" y="54">Front channels and the base under the pods</text><g transform="translate(40,80)">
<path class="sh" d="M0,20 L520,20 L520,250 L0,250 Z"/><line x1="0" y1="66" x2="520" y2="66" stroke="#8a8a8f" stroke-dasharray="5 4"/><line x1="0" y1="112" x2="520" y2="112" stroke="#8a8a8f" stroke-dasharray="5 4"/><line x1="0" y1="158" x2="520" y2="158" stroke="#8a8a8f" stroke-dasharray="5 4"/><line x1="0" y1="204" x2="520" y2="204" stroke="#8a8a8f" stroke-dasharray="5 4"/>
<path class="dim" d="M540,20 L540,66"/><text class="dt" x="550" y="48">CH = 12 cm channels (front, to HL = 76 cm)</text>
<text class="s" x="0" y="285">The same sewn-through channels continue under the pods on the back, sides and sleeves (lighter fill there).</text></g></g><g transform="translate(1260,800)"><rect class="box" width="1200" height="240" rx="8"/><text class="t" x="18" y="32">F · STITCH + FINISH</text><text class="s" x="18" y="54"></text><g transform="translate(40,84)"><text class="s" x="0" y="0">• Seam allowance 1 cm · stitch length 3 mm on channels · bartack pocket ends and both ends of every pod attach seam.</text>
<text class="s" x="0" y="26">• Pod attach order: hem row first, working up; back → sides → sleeves → shoulder pods last.</text>
<text class="s" x="0" y="52">• Hem: clean finish, no drawcord. The two-way zip opens from the bottom for walking.</text>
<text class="s" x="0" y="78">• Insulation: recycled blowable cluster recommended (no down line needed); down 90/10 as the alternative.</text>
<text class="s" x="0" y="104">• Labels: woven neck label, size label, care/composition in the left side seam.</text></g></g></svg>