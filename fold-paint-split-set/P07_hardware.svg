<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="1180" viewBox="0 0 2280 1180"><style>.t{font:700 20px Helvetica,Arial;fill:#111;letter-spacing:2px}.s{font:400 14px Helvetica,Arial;fill:#444}.l{font:600 13px Helvetica,Arial;fill:#111}.n{font:400 13px Helvetica,Arial;fill:#333}
.dim{stroke:#c0392b;stroke-width:1.4;fill:none;marker-start:url(#d);marker-end:url(#d)}.dt{font:700 13px Helvetica,Arial;fill:#c0392b}.box{fill:#fff;stroke:#d8d4cc}
.sa{fill:url(#ga);stroke:#4b5058;stroke-width:1.6}.sa2{fill:#8d939c;stroke:#4b5058;stroke-width:1.4}.gm{fill:url(#gb);stroke:#222;stroke-width:1.6}.cl{fill:#2f4170;stroke:#0d1322;stroke-width:1}.cls{fill:#c5b69d;stroke:#2a251d;stroke-width:1}</style>
<defs><marker id="d" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
<linearGradient id="ga" x1="0" x2="1"><stop offset="0" stop-color="#8d939c"/><stop offset=".5" stop-color="#f2f3f5"/><stop offset="1" stop-color="#8d939c"/></linearGradient>
<linearGradient id="gb" x1="0" x2="1"><stop offset="0" stop-color="#3f4247"/><stop offset=".5" stop-color="#8d9096"/><stop offset="1" stop-color="#3f4247"/></linearGradient>
<radialGradient id="ra" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f2f3f5"/><stop offset="1" stop-color="#8d939c"/></radialGradient>
<radialGradient id="rb" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#8d9096"/><stop offset="1" stop-color="#3f4247"/></radialGradient></defs><rect width="2280" height="1180" fill="#f4f3f0"/><g transform="translate(20,20)"><rect class="box" width="1310" height="560" rx="8"/><text class="t" x="18" y="32">A · RING-SPRING SNAP (overshirt)</text><text class="s" x="18" y="54">8 sets: stand 1 × 12.5 mm, placket 5 + cuffs 2 × 15 mm · brass, nickel-free · drawn at 7 × scale</text><circle cx="130" cy="200" r="52.5" fill="url(#ra)" stroke="#4b5058" stroke-width="1.8"/><circle cx="130" cy="200" r="32.5" fill="none" stroke="#7d838c" stroke-width="1.6"/><path class="dim" d="M77.5,272.5 L182.5,272.5"/><text class="dt" x="130.0" y="290.5" text-anchor="middle">Ø 15 mm</text><text class="l" x="130" y="135.5" text-anchor="middle">silver-tone (not used)</text><circle cx="330" cy="200" r="43.75" fill="url(#ra)" stroke="#4b5058" stroke-width="1.8"/><circle cx="330" cy="200" r="27.1" fill="none" stroke="#7d838c" stroke-width="1.6"/><path class="dim" d="M286.25,263.75 L373.75,263.75"/><text class="dt" x="330.0" y="281.75" text-anchor="middle">Ø 12.5 mm</text><text class="l" x="330" y="144.25" text-anchor="middle">stand cap</text><circle cx="530" cy="200" r="52.5" fill="url(#rb)" stroke="#4b5058" stroke-width="1.8"/><circle cx="530" cy="200" r="32.5" fill="none" stroke="#7d838c" stroke-width="1.6"/><path class="dim" d="M477.5,272.5 L582.5,272.5"/><text class="dt" x="530.0" y="290.5" text-anchor="middle">Ø 15 mm</text><text class="l" x="530" y="135.5" text-anchor="middle">GUNMETAL · chosen</text><circle cx="130" cy="380" r="43.4" fill="url(#ra)" stroke="#4b5058" stroke-width="1.6"/><circle cx="130" cy="380" r="16.8" fill="#f4f3f0" stroke="#4b5058" stroke-width="1.4"/><path d="M117.4,380 a12.6,12.6 0 0 1 25.2,0" fill="none" stroke="#4b5058" stroke-width="2"/><text class="l" x="130" y="443.4" text-anchor="middle">socket (S-spring)</text><circle cx="300" cy="380" r="43.4" fill="url(#ra)" stroke="#4b5058" stroke-width="1.6"/><circle cx="300" cy="380" r="15.400000000000002" fill="url(#ra)" stroke="#4b5058" stroke-width="2"/><text class="l" x="300" y="443.4" text-anchor="middle">stud</text><circle cx="450" cy="380" r="31.5" fill="url(#ra)" stroke="#4b5058" stroke-width="1.6"/><circle cx="450" cy="380" r="8.4" fill="#4b5058"/><text class="l" x="450" y="431.5" text-anchor="middle">post</text><g transform="translate(760,200)"><g transform="translate(0,0)"><rect class="cl" x="-20" y="0" width="240" height="7.0"/><rect class="cl" x="-20" y="9.0" width="240" height="7.0"/><rect class="cl" x="-20" y="32.0" width="240" height="7.0"/><rect class="cl" x="-20" y="41.0" width="240" height="7.0"/><path class="sa" d="M47.5,0 Q47.5,-21.0 100,-21.0 Q152.5,-21.0 152.5,0 Z"/><rect class="sa2" x="65.0" y="16.0" width="70.0" height="11.200000000000001" rx="3"/><rect class="sa2" x="86.0" y="27.200000000000003" width="28.0" height="14.0"/><rect class="sa2" x="72.0" y="48.0" width="56.0" height="9.799999999999999" rx="3"/><path class="dim" d="M250,-21.0 L250,57.8"/><text class="dt" x="256" y="22.4">stack 2–4 mm + cap</text><text class="n" x="-20" y="91.8">top placket (2 plies + fusible) · under placket (2 plies + fusible)</text></g></g><text class="n" x="40" y="490">• Cap + socket on the top (wearer's LEFT) placket, stud + post on the under placket; cuff: cap on the overlap. Fusible patch behind each.</text><text class="n" x="40" y="514">• Set with the maker's die AFTER colouring, top coat and sewing (never sprayed). Open / close 15–30 N, pull-off ≥ 90 N on the real stack.</text><text class="n" x="40" y="538">• Plain cap face (no logo deboss) unless the founder asks; a logo would use the real ANIEZE vector only.</text></g><g transform="translate(1350,20)"><rect class="box" width="910" height="560" rx="8"/><text class="t" x="18" y="32">B · FLY ZIP (trouser)</text><text class="s" x="18" y="54">Metal #5, brass teeth, nickel-free, closed end, auto-lock slider, stone tape</text><rect x="154" y="110" width="68" height="210" fill="#c5b69d" stroke="#2a251d"/><rect x="185" y="120" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="180" y="127" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="185" y="134" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="180" y="141" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="185" y="148" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="180" y="155" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="185" y="162" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="180" y="169" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="185" y="176" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="180" y="183" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="185" y="190" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="180" y="197" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="185" y="204" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="180" y="211" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="185" y="218" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="180" y="225" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="185" y="232" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="180" y="239" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="185" y="246" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="180" y="253" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="185" y="260" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="180" y="267" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="185" y="274" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="180" y="281" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><rect x="185" y="288" width="11" height="5" fill="url(#ga)" stroke="#4b5058" stroke-width=".8"/><path class="sa" d="M174,98 L202,98 L198,136 L178,136 Z"/><rect class="sa" x="182" y="136" width="12" height="40" rx="5"/><rect class="sa2" x="177" y="310" width="22" height="8" rx="2"/><path class="dim" d="M250,120 L250,310"/><text class="dt" x="256" y="219.0">18 cm (M)</text><text class="l" x="150" y="346">metal #5 · closed end · auto-lock · plain puller</text><g transform="translate(470,110)"><path class="gm" d="M0,0 L40,0 L36,50 L4,50 Z"/><rect class="gm" x="12" y="50" width="16" height="60" rx="6"/><text class="l" x="-10" y="136">finish B slider</text></g><text class="n" x="40" y="440">• Length by size: XS–S 17 cm, M–L 18 cm, XL–2XL 19 cm (fly opening FL − 1).</text><text class="n" x="40" y="464">• Wearer's LEFT over right, J-stitch 3.8 cm. EN 16732 zip strength.</text><text class="n" x="40" y="488">• Tape colour stone; teeth + slider in the SAME finish as the snaps.</text><text class="n" x="40" y="512">• Sewn in after colouring (the zip is never sprayed).</text></g><g transform="translate(20,600)"><rect class="box" width="1310" height="560" rx="8"/><text class="t" x="18" y="32">C · HOOK + BAR, INSIDE BUTTON (trouser)</text><text class="s" x="18" y="54">Flat trouser hook + bar, brass, nickel-free · 15 mm flat 4-hole button, brass</text><g transform="translate(80,130)"><path class="sa" d="M0,0 L158,0 Q175,0 175,21 L175,42 L133,42 L133,21 L0,21 Z"/><circle cx="21" cy="10" r="4.9" fill="#fff" stroke="#4b5058"/><circle cx="56" cy="10" r="4.9" fill="#fff" stroke="#4b5058"/><circle cx="91" cy="10" r="4.9" fill="#fff" stroke="#4b5058"/><path class="dim" d="M0,60.0 L175.0,60.0"/><text class="dt" x="87.5" y="78.0" text-anchor="middle">hook ≈ 25 mm</text><rect class="sa" x="0" y="105.0" width="154.0" height="28.0" rx="6"/><rect x="42.0" y="113.39999999999999" width="70.0" height="11.200000000000001" fill="#fff" stroke="#4b5058"/><path class="dim" d="M0,151.0 L154.0,151.0"/><text class="dt" x="77.0" y="169.0" text-anchor="middle">bar ≈ 22 mm</text><text class="l" x="0" y="-16">silver-tone (not used)</text></g><g transform="translate(420,130)"><path class="sa" d="M0,0 L158,0 Q175,0 175,21 L175,42 L133,42 L133,21 L0,21 Z"/><circle cx="21" cy="10" r="4.9" fill="#fff" stroke="#4b5058"/><circle cx="56" cy="10" r="4.9" fill="#fff" stroke="#4b5058"/><circle cx="91" cy="10" r="4.9" fill="#fff" stroke="#4b5058"/><path class="dim" d="M0,60.0 L175.0,60.0"/><text class="dt" x="87.5" y="78.0" text-anchor="middle">hook ≈ 25 mm</text><rect class="sa" x="0" y="105.0" width="154.0" height="28.0" rx="6"/><rect x="42.0" y="113.39999999999999" width="70.0" height="11.200000000000001" fill="#fff" stroke="#4b5058"/><path class="dim" d="M0,151.0 L154.0,151.0"/><text class="dt" x="77.0" y="169.0" text-anchor="middle">bar ≈ 22 mm</text><text class="l" x="0" y="-16">hook + bar · GUNMETAL</text></g><g transform="translate(860,140)"><circle cx="60" cy="60" r="52.5" fill="url(#ra)" stroke="#4b5058" stroke-width="1.6"/><circle cx="60" cy="60" r="37.8" fill="none" stroke="#7d838c"/><circle cx="48.8" cy="48.8" r="4.2" fill="#f4f3f0" stroke="#4b5058"/><circle cx="48.8" cy="71.2" r="4.2" fill="#f4f3f0" stroke="#4b5058"/><circle cx="71.2" cy="48.8" r="4.2" fill="#f4f3f0" stroke="#4b5058"/><circle cx="71.2" cy="71.2" r="4.2" fill="#f4f3f0" stroke="#4b5058"/><path class="dim" d="M7.5,132.5 L112.5,132.5"/><text class="dt" x="60.0" y="150.5" text-anchor="middle">Ø 15 mm</text><circle cx="220" cy="60" r="52.5" fill="url(#rb)" stroke="#4b5058" stroke-width="1.6"/><circle cx="220" cy="60" r="37.8" fill="none" stroke="#7d838c"/><circle cx="208.8" cy="48.8" r="4.2" fill="#f4f3f0" stroke="#4b5058"/><circle cx="208.8" cy="71.2" r="4.2" fill="#f4f3f0" stroke="#4b5058"/><circle cx="231.2" cy="48.8" r="4.2" fill="#f4f3f0" stroke="#4b5058"/><circle cx="231.2" cy="71.2" r="4.2" fill="#f4f3f0" stroke="#4b5058"/><path class="dim" d="M167.5,132.5 L272.5,132.5"/><text class="dt" x="220.0" y="150.5" text-anchor="middle">Ø 15 mm</text><text class="l" x="10" y="-6">not used / GUNMETAL</text></g><text class="n" x="40" y="440">• Hook on the overlap facing (wearer's left), bar on the underlap; 4 prongs each through the waistband + curtain, washer plates inside.</text><text class="n" x="40" y="464">• Inside button on the 4 cm underlap extension, buttonhole in the overlap facing; sewn with a thread shank. Pull ≥ 90 N.</text><text class="n" x="40" y="488">• Same finish lot as the overshirt snaps (one lot per set).</text></g><g transform="translate(1350,600)"><rect class="box" width="910" height="560" rx="8"/><text class="t" x="18" y="32">D · FINISHES + TESTS</text><text class="s" x="18" y="54">All metal, brass, NICKEL-FREE · one finish lot per set (shirt + trouser)</text><rect x="40" y="90" width="60" height="40" fill="url(#ga)" stroke="#4b5058"/><text class="l" x="112" y="108">A · silver-tone: NOT USED</text><text class="n" x="112" y="126">PVD, or tin-based plating (e.g. white bronze). NOT nickel plating.</text><rect x="40" y="150" width="60" height="40" fill="url(#gb)" stroke="#222"/><text class="l" x="112" y="168">B · nickel-free GUNMETAL: CHOSEN</text><text class="n" x="112" y="186">PVD or tin-cobalt. Not black nickel.</text><text class="n" x="40" y="240">• EN 1811 nickel release AFTER EN 12472 wear simulation, for EACH finish.</text><text class="n" x="40" y="264">• REACH Annex XVII: Pb &lt; 0.05 % (63) · Cd &lt; 0.01 % (23) · Ni &lt; 0.5 µg/cm²/week (27).</text><text class="n" x="40" y="288">• ISO 9227 neutral salt spray 24 h, no red rust.</text><text class="n" x="40" y="312">• One leather-specialist clean cycle on a hardware card: no finish loss.</text><text class="n" x="40" y="336">• Pull tests ≥ 90 N on the real leather + fusible stack, 5 of each at proto.</text><text class="n" x="40" y="360">• Hardware never goes through the spray booth or the top coat (set after).</text><text class="n" x="40" y="384">• Approve one hardware card per finish before bulk.</text></g></svg>