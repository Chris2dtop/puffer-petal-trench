<svg xmlns="http://www.w3.org/2000/svg" width="2440" height="1370" viewBox="0 0 2440 1370"><style>.box{fill:#fff;stroke:#d8d4cc}.num{font:800 30px Helvetica,Arial;fill:#c0392b}.h{font:700 17px Helvetica,Arial;fill:#111;letter-spacing:1px}.n{font:400 13px Helvetica,Arial;fill:#333}
.l{font:600 12px Helvetica,Arial;fill:#111}.r{font:700 12px Helvetica,Arial;fill:#c0392b}.ind{fill:#25375f;stroke:#0d1322;stroke-width:1.4}.stn{fill:#c5b69d;stroke:#2a251d;stroke-width:1.4}
.ink{fill:none;stroke:#222;stroke-width:1.6}.bst{fill:none;stroke:#c0392b;stroke-width:1.6;stroke-dasharray:5 4}.set{fill:none;stroke:#2f7d5b;stroke-width:5;opacity:.5}
.tbl{fill:#efe9dd;stroke:#9d927f;stroke-width:1.4}.tpl{fill:none;stroke:#c0392b;stroke-width:1.2;stroke-dasharray:3 3}.stm{fill:none;stroke:#8aa0b8;stroke-width:2;stroke-linecap:round}
.wat{fill:#d6e4ef;stroke:#7d98b3;stroke-width:1.4}.t{font:700 24px Helvetica,Arial;fill:#111;letter-spacing:2px}.s{font:400 14px Helvetica,Arial;fill:#555}</style>
<defs><filter id="feP" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8.2"/></filter><filter id="fsP" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.7"/></filter><marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
<radialGradient id="blob" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#a2482a"/><stop offset=".5" stop-color="#c88b4d"/><stop offset="1" stop-color="#c88b4d" stop-opacity="0"/></radialGradient>
<radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a2482a"/><stop offset=".75" stop-color="#a2482a" stop-opacity=".7"/><stop offset="1" stop-color="#a2482a" stop-opacity="0"/></radialGradient>
<filter id="bl"><feGaussianBlur stdDeviation="5"/></filter></defs><rect width="2440" height="1370" fill="#f4f3f0"/><text class="t" x="20" y="46">HOW THE PAINTING IS DONE · route A (to be validated on proto panels)</text><text class="s" x="20" y="72">FP01 indigo overshirt: DISCHARGE painting (illuminating rust + caramel replace the indigo) · FP02 stone trouser: direct acid-dye painting · both pieces painted together on one template, then steam-fixed</text><g transform="translate(20,110)"><rect class="box" width="585" height="360" rx="8"/><text class="num" x="18" y="40">1</text><text class="h" x="62" y="36">LAB DIPS + STRIKE-OFFS</text><g transform="translate(20,46)"><rect class="ind" x="20" y="20" width="110" height="80" rx="4"/><circle cx="75" cy="60" r="26" fill="#c88b4d" filter="url(#bl)"/><text class="l" x="20" y="120">indigo + caramel</text><text class="r" x="20" y="136">(discharge)</text><rect class="ind" x="155" y="20" width="110" height="80" rx="4"/><circle cx="210" cy="60" r="26" fill="#a2482a" filter="url(#bl)"/><text class="l" x="155" y="120">indigo + rust</text><text class="r" x="155" y="136">(discharge)</text><rect class="stn" x="290" y="20" width="110" height="80" rx="4"/><circle cx="345" cy="60" r="26" fill="#c88b4d" filter="url(#bl)"/><text class="l" x="290" y="120">stone + caramel</text><text class="r" x="290" y="136">(acid)</text><rect class="stn" x="425" y="20" width="110" height="80" rx="4"/><circle cx="480" cy="60" r="26" fill="#a2482a" filter="url(#bl)"/><text class="l" x="425" y="120">stone + rust</text><text class="r" x="425" y="136">(acid)</text><text class="l" x="20" y="160">→ ISO 105-X12 · D01 · B02 · strike-off per fabric</text></g><text class="n" x="20" y="252">Approve the four colours (indigo + stone bases, rust + caramel on each) and one</text><text class="n" x="20" y="269">full-route strike-off per fabric. Tests: ISO 105-X12, D01, B02. Nothing is cut</text><text class="n" x="20" y="286">before approval.</text></g><g transform="translate(625,110)"><rect class="box" width="585" height="360" rx="8"/><text class="num" x="18" y="40">2</text><text class="h" x="62" y="36">CUT + NOTCH</text><g transform="translate(20,46)"><path class="ind" d="M40,30 L300,30 L300,150 L40,150 Z"/><path class="stn" d="M330,30 L500,30 L520,160 L330,160 Z"/><path d="M80,150 l-5,-9 l10,0 Z" fill="#c0392b"/><path d="M130,150 l-5,-9 l10,0 Z" fill="#c0392b"/><path d="M170,150 l-5,-9 l10,0 Z" fill="#c0392b"/><path d="M210,150 l-5,-9 l10,0 Z" fill="#c0392b"/><path d="M260,150 l-5,-9 l10,0 Z" fill="#c0392b"/><path d="M330,60 l9,-5 l0,10 Z" fill="#c0392b"/><path d="M330,120 l9,-5 l0,10 Z" fill="#c0392b"/><path d="M170,30 L170,150" stroke="#fff" stroke-dasharray="5 4"/><text class="r" x="40" y="175">3 mm notches in the allowance · thread-trace CF / PS</text></g><text class="n" x="20" y="252">Cut each size's pieces, snip the 3 mm registration notches in the allowances,</text><text class="n" x="20" y="269">thread-trace CF / CB and the pleat seam line. Keep the pieces of one set</text><text class="n" x="20" y="286">together (set number).</text></g><g transform="translate(1230,110)"><rect class="box" width="585" height="360" rx="8"/><text class="num" x="18" y="40">3</text><text class="h" x="62" y="36">PLEAT + PERMANENT SET</text><g transform="translate(20,46)"><path class="ink" d="M60,130 L100,70 L140,130 L180,70 L220,130 L260,70 L300,130 L340,70 L380,130 L420,70 L460,130" stroke-width="3"/><path class="set" d="M100,60 l0,80"/><path class="set" d="M180,60 l0,80"/><path class="set" d="M260,60 l0,80"/><path class="set" d="M340,60 l0,80"/><path class="set" d="M420,60 l0,80"/><path class="stm" d="M120,40 q8,-12 0,-24 M200,40 q8,-12 0,-24 M280,40 q8,-12 0,-24 M360,40 q8,-12 0,-24"/><text class="r" x="60" y="170">fold → chemical set (green, MEA-sulphite type) → press</text></g><text class="n" x="20" y="252">At the pleating / finishing house: form the knife pleats (overshirt panel: 36</text><text class="n" x="20" y="269">pleats, face ≈ 3 cm, depth 6 cm; trouser: 2 per leg + crease), apply the</text><text class="n" x="20" y="286">chemical set (MEA-sulphite type, Si-Ro-Set principle), press. To be validated on</text><text class="n" x="20" y="303">proto panels.</text></g><g transform="translate(1835,110)"><rect class="box" width="585" height="360" rx="8"/><text class="num" x="18" y="40">4</text><text class="h" x="62" y="36">BASTE SHUT + BUILD PAINT UNITS</text><g transform="translate(20,46)"><rect class="ind" x="30" y="80" width="250" height="80"/><path d="M70,80 l0,80" stroke="#000" stroke-width="4" opacity=".18"/><path class="ink" d="M66,80 l0,80"/><path class="bst" d="M61,84 l0,72"/><path d="M105,80 l0,80" stroke="#000" stroke-width="4" opacity=".18"/><path class="ink" d="M101,80 l0,80"/><path class="bst" d="M96,84 l0,72"/><path d="M141,80 l0,80" stroke="#000" stroke-width="4" opacity=".18"/><path class="ink" d="M137,80 l0,80"/><path class="bst" d="M132,84 l0,72"/><path d="M177,80 l0,80" stroke="#000" stroke-width="4" opacity=".18"/><path class="ink" d="M173,80 l0,80"/><path class="bst" d="M168,84 l0,72"/><path d="M213,80 l0,80" stroke="#000" stroke-width="4" opacity=".18"/><path class="ink" d="M209,80 l0,80"/><path class="bst" d="M204,84 l0,72"/><path d="M248,80 l0,80" stroke="#000" stroke-width="4" opacity=".18"/><path class="ink" d="M244,80 l0,80"/><path class="bst" d="M239,84 l0,72"/><rect class="ind" x="30" y="25" width="250" height="55"/><path d="M30,80 l250,0" stroke="#0d1322" stroke-width="2.5"/><rect class="stn" x="320" y="60" width="200" height="100"/><path d="M391,60 l0,100" stroke="#000" stroke-width="4" opacity=".18"/><path class="ink" d="M387,60 l0,100"/><path class="bst" d="M382,64 l0,92"/><path d="M457,60 l0,100" stroke="#000" stroke-width="4" opacity=".18"/><path class="ink" d="M453,60 l0,100"/><path class="bst" d="M448,64 l0,92"/><text class="r" x="30" y="180">basting 1 cm from every fold · shirt unit joined at PS</text></g><text class="n" x="20" y="252">Baste every pleat shut with polyester thread 1 cm from the fold, full length.</text><text class="n" x="20" y="269">Join the overshirt units at the pleat seam: upper front + pleated front, back</text><text class="n" x="20" y="286">body + pleated back (yoke and plackets NOT on yet). Trouser: front and back legs</text><text class="n" x="20" y="303">as single panels.</text></g><g transform="translate(20,490)"><rect class="box" width="585" height="360" rx="8"/><text class="num" x="18" y="40">5</text><text class="h" x="62" y="36">LAY UP ON THE TEMPLATE</text><g transform="translate(20,46)"><rect class="tbl" x="20" y="10" width="500" height="170" rx="6"/><path class="tpl" d="M150,20 L390,20 L390,80 L150,80 Z M160,80 L270,80 L262,172 L160,172 Z M280,80 L380,80 L380,172 L288,172 Z"/><rect class="ind" x="150" y="20" width="240" height="60" opacity=".95"/><path class="stn" d="M160,80 L270,80 L262,172 L160,172 Z M280,80 L380,80 L380,172 L288,172 Z"/><circle cx="150" cy="50" r="4" fill="#c0392b"/><circle cx="390" cy="50" r="4" fill="#c0392b"/><circle cx="270" cy="80" r="4" fill="#c0392b"/><circle cx="160" cy="120" r="4" fill="#c0392b"/><circle cx="380" cy="120" r="4" fill="#c0392b"/><text class="r" x="400" y="110">pins through</text><text class="r" x="400" y="126">the notches</text></g><text class="n" x="20" y="252">Padded table covered in plastic; the 1:1 template for the size; pin the units</text><text class="n" x="20" y="269">through the notches: overshirt above, trouser below, shirt hem touching the</text><text class="n" x="20" y="286">trouser waistband line (laid-flat layout). Plastic sheet under every unit.</text></g><g transform="translate(625,490)"><rect class="box" width="585" height="360" rx="8"/><text class="num" x="18" y="40">6</text><text class="h" x="62" y="36">MIX THE PASTES</text><g transform="translate(20,46)"><path d="M40,40 L130,40 L124,150 L46,150 Z" fill="#f4f3f0" stroke="#666" stroke-width="1.6"/><path d="M44,80 L126,80 L124,150 L46,150 Z" fill="#a2482a" opacity=".85"/><path d="M150,70 L230,70 L225,150 L155,150 Z" fill="#f4f3f0" stroke="#666" stroke-width="1.6"/><path d="M153,96 L227,96 L225,150 L155,150 Z" fill="#c88b4d" opacity=".85"/><rect x="40" y="10" width="18" height="18" fill="#25375f" stroke="#222"/><text class="l" x="64" y="24">FP01 · DISCHARGE</text><text class="n" x="40" y="172">Decrolin-type + illuminating dyes</text><path d="M290,40 L380,40 L374,150 L296,150 Z" fill="#f4f3f0" stroke="#666" stroke-width="1.6"/><path d="M294,80 L376,80 L374,150 L296,150 Z" fill="#a2482a" opacity=".85"/><path d="M400,70 L480,70 L475,150 L405,150 Z" fill="#f4f3f0" stroke="#666" stroke-width="1.6"/><path d="M403,96 L477,96 L475,150 L405,150 Z" fill="#c88b4d" opacity=".85"/><rect x="290" y="10" width="18" height="18" fill="#c5b69d" stroke="#222"/><text class="l" x="314" y="24">FP02 · ACID PAINT</text><text class="n" x="290" y="172">milling / 1:2 metal-complex</text><text class="r" x="40" y="190">all thickened with sodium alginate · pH 4–5</text></g><text class="n" x="20" y="252">FP01 indigo: DISCHARGE paste = non-alkaline discharge agent for wool (Decrolin-</text><text class="n" x="20" y="269">type) + illuminating acid dyes (rust, caramel) in sodium alginate. FP02 stone:</text><text class="n" x="20" y="286">milling / 1:2 metal-complex acid dyes in sodium alginate, citric acid to pH 4–5.</text><text class="n" x="20" y="303">Thin versions for the spray.</text></g><g transform="translate(1230,490)"><rect class="box" width="585" height="360" rx="8"/><text class="num" x="18" y="40">7</text><text class="h" x="62" y="36">PAINT: RUST CORES</text><g transform="translate(20,46)"><rect class="ind" x="40" y="20" width="220" height="150"/><path class="tpl" d="M90,40 C60,90 70,150 130,160 C190,165 220,120 205,70 C190,30 120,20 90,40 Z"/><ellipse cx="135" cy="85" rx="40" ry="34" fill="url(#core)"/><path d="M260,40 L176,82" stroke="#6b4a2a" stroke-width="7" stroke-linecap="round"/><path d="M176,82 l-10,6" stroke="#222" stroke-width="9" stroke-linecap="round"/><rect class="stn" x="300" y="20" width="220" height="150"/><path class="tpl" d="M340,30 L470,30 L462,160 L420,120 L380,165 Z"/><ellipse cx="405" cy="70" rx="42" ry="30" fill="url(#core)"/><text class="r" x="40" y="190">inside the inner envelope · one gesture across both pieces</text></g><text class="n" x="20" y="252">Brush the rust cores first, inside the inner envelope, following the template</text><text class="n" x="20" y="269">outline at ±2 cm. Work across the shirt hem onto the trouser in one gesture so</text><text class="n" x="20" y="286">the shapes run on.</text></g><g transform="translate(1835,490)"><rect class="box" width="585" height="360" rx="8"/><text class="num" x="18" y="40">8</text><text class="h" x="62" y="36">PAINT: CARAMEL + FEATHER</text><g transform="translate(20,46)"><rect class="ind" x="40" y="20" width="220" height="150"/><ellipse cx="140" cy="95" rx="78" ry="64" fill="url(#blob)" filter="url(#bl)"/><path d="M300,60 L250,95" stroke="#666" stroke-width="10" stroke-linecap="round"/><path d="M246,98 L200,70 M246,98 L200,125 M246,98 L190,98" stroke="#c88b4d" stroke-width="1.2" stroke-dasharray="2 4"/><rect class="stn" x="320" y="20" width="200" height="150"/><ellipse cx="420" cy="95" rx="70" ry="60" fill="url(#blob)" filter="url(#bl)"/><text class="r" x="40" y="190">feather 3–6 cm · NO splatter · ≈ 80 % base colour</text></g><text class="n" x="20" y="252">Brush caramel around the cores, then feather every edge over 3–6 cm with a damp</text><text class="n" x="20" y="269">brush and a fine spray. No splatter, no drips. Check ≈ 80 % base colour per</text><text class="n" x="20" y="286">piece. Every piece is unique inside the envelope.</text></g><g transform="translate(20,870)"><rect class="box" width="585" height="360" rx="8"/><text class="num" x="18" y="40">9</text><text class="h" x="62" y="36">DRY + ROLL</text><g transform="translate(20,46)"><ellipse cx="120" cy="100" rx="30" ry="60" fill="#f7f3ea" stroke="#999" stroke-width="1.6"/><rect x="120" y="40" width="300" height="120" fill="#f7f3ea" stroke="#999"/><ellipse cx="420" cy="100" rx="30" ry="60" fill="#efe9dd" stroke="#999" stroke-width="1.6"/><path d="M420,40 Q460,60 470,100" stroke="#999" fill="none"/><path d="M130,70 l270,0 M130,100 l270,0 M130,130 l270,0" stroke="#e1d8c6"/><text class="r" x="90" y="190">clean unprinted paper · painted faces never touch</text></g><text class="n" x="20" y="252">Let the paste dry flat (no contact between units). Roll each unit in clean</text><text class="n" x="20" y="269">unprinted paper so painted faces never touch.</text></g><g transform="translate(625,870)"><rect class="box" width="585" height="360" rx="8"/><text class="num" x="18" y="40">10</text><text class="h" x="62" y="36">STEAM-FIX</text><g transform="translate(20,46)"><rect x="120" y="20" width="300" height="150" rx="10" fill="#e7ebef" stroke="#7d8a99" stroke-width="2"/><rect x="170" y="60" width="34" height="100" rx="12" fill="#f7f3ea" stroke="#999"/><rect x="230" y="60" width="34" height="100" rx="12" fill="#f7f3ea" stroke="#999"/><rect x="290" y="60" width="34" height="100" rx="12" fill="#f7f3ea" stroke="#999"/><rect x="350" y="60" width="34" height="100" rx="12" fill="#f7f3ea" stroke="#999"/><path class="stm" d="M160,50 q10,-12 0,-24 M260,50 q10,-12 0,-24 M360,50 q10,-12 0,-24"/><text class="r" x="120" y="190">saturated steam 102 °C · 30–45 min · no drips</text></g><text class="n" x="20" y="252">Saturated steam at 102 °C for 30–45 min (discharge: per the dye-house recipe),</text><text class="n" x="20" y="269">rolls standing, no condensate drips. Cool slowly.</text></g><g transform="translate(1230,870)"><rect class="box" width="585" height="360" rx="8"/><text class="num" x="18" y="40">11</text><text class="h" x="62" y="36">RINSE + NEUTRALISE</text><g transform="translate(20,46)"><path class="wat" d="M100,70 L440,70 L420,170 L120,170 Z"/><path d="M110,90 q30,-10 60,0 t60,0 t60,0 t60,0 t60,0" fill="none" stroke="#7d98b3" stroke-width="1.6"/><rect class="ind" x="180" y="100" width="90" height="50" rx="4" opacity=".9"/><rect class="stn" x="290" y="100" width="90" height="50" rx="4"/><text class="r" x="100" y="190">cold → ≤ 40 °C non-ionic soap · NO agitation (felting)</text></g><text class="n" x="20" y="252">Cold rinse, then ≤ 40 °C with a non-ionic soap, NO agitation (wool felts); the</text><text class="n" x="20" y="269">discharged FP01 units get an extra rinse to remove reducing-agent residues and</text><text class="n" x="20" y="286">smell. Dry flat.</text></g><g transform="translate(1835,870)"><rect class="box" width="585" height="360" rx="8"/><text class="num" x="18" y="40">12</text><text class="h" x="62" y="36">RELEASE + RE-SET + QC</text><g transform="translate(20,46)"><rect class="ind" x="40" y="40" width="200" height="110"/><path d="M77,40 l0,110" stroke="#000" stroke-width="4" opacity=".18"/><path class="ink" d="M73,40 l0,110"/><path d="M111,40 l0,110" stroke="#000" stroke-width="4" opacity=".18"/><path class="ink" d="M107,40 l0,110"/><path d="M144,40 l0,110" stroke="#000" stroke-width="4" opacity=".18"/><path class="ink" d="M140,40 l0,110"/><path d="M177,40 l0,110" stroke="#000" stroke-width="4" opacity=".18"/><path class="ink" d="M173,40 l0,110"/><path d="M211,40 l0,110" stroke="#000" stroke-width="4" opacity=".18"/><path class="ink" d="M207,40 l0,110"/><path d="M300,120 L420,120 Q440,90 400,80 L330,80 Q300,90 300,120 Z" fill="#cfd3d8" stroke="#555" stroke-width="1.6"/><path d="M340,80 q20,-30 50,0" fill="none" stroke="#555" stroke-width="5"/><path d="M450,60 l14,16 l30,-36" fill="none" stroke="#2f7d5b" stroke-width="6"/><rect x="440" y="100" width="70" height="40" rx="4" fill="#f7f3ea" stroke="#999"/><text class="l" x="448" y="125">SET 017</text><text class="r" x="40" y="190">pull basting · re-press + re-set · check envelope + colour · tag</text></g><text class="n" x="20" y="252">Pull the basting, re-press and re-set the pleats and creases. Check each piece</text><text class="n" x="20" y="269">against the template envelope and the colour standard, tag the set number,</text><text class="n" x="20" y="286">photograph it, then make the garments.</text></g><text class="n" x="20" y="1270">Fallback B (only if route A fails on the proto panels): paint the panels FLAT, steam-fix, rinse, then pleat and set. The composition then splits across pleat faces and underlays (the shapes look broken into stripes when the pleats</text><text class="n" x="20" y="1288">close) and registration across the pleats is lost. Not the design intent.</text><text class="n" x="20" y="1314">Every outline: ±2 cm from the template (paint map). Shapes, colours and tests: see the paint map, the colour standards and the test plan. Not pigment: dyes only, the hand stays soft.</text></svg>