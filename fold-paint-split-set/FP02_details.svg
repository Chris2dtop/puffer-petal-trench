<path class="ar" d="M760.0,290.0 L600.0,244.0"/><text class="l" x="765.0" y="294.0" text-anchor="start">seat seam: 2.5 cm allowance at CB (alteration)</text>
<text class="n" x="0" y="350">Front AND back lined. The lining is joined at the waistband seam, round the fly and into the side seams; free hem at the knee; never coloured.</text></g></g><g transform="translate(1260,960)"><rect class="box" width="1200" height="440" rx="8"/><text class="t" x="18" y="32">F · HEM + POOLING</text><text class="s" x="18" y="54">Turned 4 cm, blind-stitched · heel tape · ≈ 4 cm pooling</text><g transform="translate(40,70)"><rect class="w" x="0" y="6" width="26" height="9"/><text class="n" x="34" y="15">stone lamb suede 0.6–0.7 mm</text><rect class="ip" x="260" y="6" width="26" height="9"/><text class="n" x="294" y="15">woven fusible</text><rect class="pkt" x="410" y="6" width="26" height="9"/><text class="n" x="444" y="15">pocketing</text><rect class="lin" x="540" y="6" width="26" height="9"/><text class="n" x="574" y="15">cupro lining</text>
