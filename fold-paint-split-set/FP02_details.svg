<text class="n" x="0" y="350">Two jetted back pockets, BPX = 11.5 cm from CB to the pocket centre. Plain, no tab (house rule: clean back).</text></g></g><g transform="translate(20,960)"><rect class="box" width="1200" height="440" rx="8"/><text class="t" x="18" y="32">E · LINING + SEAMS</text><text class="s" x="18" y="54">Cupro, front + back, to the knee · glued + topstitched seams · knee join KJ</text><g transform="translate(40,70)"><rect class="w" x="0" y="6" width="26" height="9"/><text class="n" x="34" y="15">stone lamb suede 0.6–0.7 mm</text><rect class="ip" x="260" y="6" width="26" height="9"/><text class="n" x="294" y="15">woven fusible</text><rect class="pkt" x="410" y="6" width="26" height="9"/><text class="n" x="444" y="15">pocketing</text><rect class="lin" x="540" y="6" width="26" height="9"/><text class="n" x="574" y="15">cupro lining</text>
<g transform="translate(60,40)"><path class="oS" d="M0,0 L72,0 L76,48 L86,269 L5,269 L0,74 Z"/>
