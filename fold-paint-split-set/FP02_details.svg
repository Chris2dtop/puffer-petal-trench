<text class="big" x="420" y="70">seams</text>
<rect class="w" x="420" y="120" width="220" height="7"/><rect class="w" x="660" y="120" width="220" height="7"/><path d="M640,120 l0,7 M660,120 l0,7" stroke="#2a251d" stroke-width="2"/><rect class="w" x="600" y="129" width="40" height="6"/><rect class="w" x="660" y="129" width="40" height="6"/>
