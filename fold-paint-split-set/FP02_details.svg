<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="1440" viewBox="0 0 2480 1440"><style>.t{font:700 20px Helvetica,Arial;fill:#111;letter-spacing:2px}.s{font:400 14px Helvetica,Arial;fill:#444}.l{font:600 13px Helvetica,Arial;fill:#111}
