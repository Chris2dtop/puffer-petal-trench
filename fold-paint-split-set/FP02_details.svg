<path class="ar" d="M880.0,330.0 L640.0,300.0"/><text class="l" x="885.0" y="334.0" text-anchor="start">colour ≥ 1 cm from CF</text>
<text class="n" x="0" y="350">4.5 cm waistband split at CB (alteration), hook + bar + inside button on the 4 cm underlap; 6 belt loops. Waistband never coloured (attached after colouring).</text></g></g><g transform="translate(1260,500)"><rect class="box" width="1200" height="440" rx="8"/><text class="t" x="18" y="32">D · BACK JETTED POCKET</text><text class="s" x="18" y="54">2 jets × 5 mm · dart · bag in pocketing</text><g transform="translate(40,70)"><rect class="w" x="0" y="6" width="26" height="9"/><text class="n" x="34" y="15">stone lamb suede 0.6–0.7 mm</text><rect class="ip" x="260" y="6" width="26" height="9"/><text class="n" x="294" y="15">woven fusible</text><rect class="pkt" x="410" y="6" width="26" height="9"/><text class="n" x="444" y="15">pocketing</text><rect class="lin" x="540" y="6" width="26" height="9"/><text class="n" x="574" y="15">cupro lining</text>
