<linearGradient id="pt" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a2482a" stop-opacity=".85"/><stop offset=".5" stop-color="#c88b4d" stop-opacity=".8"/><stop offset="1" stop-color="#c88b4d" stop-opacity="0"/></linearGradient></defs><rect width="2480" height="1440" fill="#f4f3f0"/><g transform="translate(20,20)"><rect class="box" width="1200" height="460" rx="8"/><text class="t" x="18" y="32">A · FRONT PLEATS + SLANT POCKET</text><text class="s" x="18" y="54">Wearer's left front at M · 2 deep knife pleats toward the side seam · colour over the pleats</text><g transform="translate(20,0)"><path class="oS" d="M50.0,100.0 L336.0,100.0 L345.8,122.0 L354.7,144.0 L362.7,166.0 L369.8,188.0 L376.0,210.0 L381.3,232.0 L385.8,254.0 L389.3,276.0 L392.0,298.0 L393.8,320.0 L395.1,342.0 L396.4,364.0 L397.7,386.0 L50.0,386.0 Z"/><rect x="66" y="150" width="176" height="236" fill="url(#pt)"/><path class="oS" d="M50.0,100.0 L336.0,100.0 L356.8,149.5 L50.0,149.5 Z"/><path class="und" d="M187.5,149.5 L164.4,281.5"/><path class="fold" d="M154.5,149.5 Q158.9,281.5 172.1,369.5"/><path class="und" d="M223.2,149.5 L205.9,281.5"/><path class="fold" d="M198.5,149.5 Q202.9,281.5 207.3,369.5"/><path d="M279.8,149.5 L395.4,347.5" stroke="#2a251d" stroke-width="2.4"/><path class="ts" d="M273.2,149.5 L387.7,347.5"/><path d="M395.4,347.5 l-40,0" stroke="#2a251d" stroke-width="2.4"/><path class="cr" d="M154.5,314.5 L167.7,386.0"/><path class="dim" d="M50.0,82.0 L154.5,82.0"/><text class="dt" x="102.2" y="74.0" text-anchor="middle">P1 9.5</text><path class="dim" d="M154.5,82.0 L198.5,82.0"/><text class="dt" x="176.5" y="74.0" text-anchor="middle">P2 4</text><path class="dim" d="M279.8,82.0 L356.8,82.0"/><text class="dt" x="318.3" y="74.0" text-anchor="middle">SPX 7</text><path class="dim" d="M465.4,149.5 L465.4,347.5"/><text class="dt" x="457.4" y="252.5" text-anchor="end">SPD 18</text><path class="ar" d="M520.0,190.0 L160.0,248.5"/><text class="l" x="525.0" y="194.0" text-anchor="start">pleat 1 · intake 6 cm · on the crease line</text><path class="ar" d="M520.0,160.0 L201.8,215.5"/><text class="l" x="525.0" y="164.0" text-anchor="start">pleat 2 · intake 4.5 cm</text><path class="ar" d="M520.0,250.0 L337.6,248.5"/><text class="l" x="525.0" y="254.0" text-anchor="start">slant pocket: stay-taped, faced, edge-stitched + 6 mm topstitch</text><path class="ar" d="M520.0,300.0 L116.0,298.0"/><text class="l" x="525.0" y="304.0" text-anchor="start">colour over the clipped-shut pleats, ≥ 1.5 cm inside the pocket edge</text><path class="ar" d="M520.0,340.0 L165.5,364.0"/><text class="l" x="525.0" y="344.0" text-anchor="start">soft crease (cool press through paper)</text><text class="n" x="20" y="430">Folds toward the side seam, edge-stitched 12 cm below the waistband seam, then free. Waistband, loops and pocket parts stay plain stone.</text></g></g><g transform="translate(1260,20)"><rect class="box" width="1200" height="460" rx="8"/><text class="t" x="18" y="32">B · PLEATS + CREASE IN SUEDE</text><text class="s" x="18" y="54">Edge-stitched pleats, soft crease · to be validated on the proto</text><g transform="translate(40,70)"><rect class="w" x="0" y="6" width="26" height="9"/><text class="n" x="34" y="15">stone lamb suede 0.6–0.7 mm</text><rect class="ip" x="260" y="6" width="26" height="9"/><text class="n" x="294" y="15">woven fusible</text><rect class="pkt" x="410" y="6" width="26" height="9"/><text class="n" x="444" y="15">pocketing</text><rect class="lin" x="540" y="6" width="26" height="9"/><text class="n" x="574" y="15">cupro lining</text>
<text class="big" x="0" y="56">① knife pleat section at the waistband seam (schematic)</text>
<path class="set" d="M246,112 L246,168"/><path class="set" d="M168,132 L168,168"/>
<path class="ln" d="M90.0,120.0 L246.0,120.0 L246.0,139.8 L168.0,139.8 L168.0,159.6 L246.0,159.6 L246.0,120.0 L480.0,120.0"/><path class="ln2" d="M90.0,120.0 L246.0,120.0 L246.0,139.8 L168.0,139.8 L168.0,159.6 L246.0,159.6 L246.0,120.0 L480.0,120.0"/>
<path class="dim" d="M168.0,200.0 L246.0,200.0"/><text class="dt" x="207.0" y="218.0" text-anchor="middle">fold depth 3 (intake 6)</text>
<path class="ar" d="M520.0,80.0 L246.0,114.0"/><text class="l" x="525.0" y="84.0" text-anchor="start">fold edge → toward the side seam</text><path class="ar" d="M520.0,160.0 L168.0,160.0"/><text class="l" x="525.0" y="164.0" text-anchor="start">edge-stitch 1.5 mm, 12 cm (green)</text>
<text class="big" x="0" y="235">② sequence (to be validated on proto panels)</text>
<text class="n" x="0" y="260">1. Cut, mark the pleat and crease lines (chalk on the flesh side, never on the nap).</text><text class="n" x="0" y="279">2. Fold the 2 pleats, clip them in the allowance (no pins in the field).</text><text class="n" x="0" y="298">3. Colour: suede dye airbrushed over the closed pleats, fixed, nap brushed, repellent.</text><text class="n" x="0" y="317">4. Edge-stitch each fold 1.5 mm for 12 cm below the waistband seam, walking foot.</text><text class="n" x="0" y="336">5. Soft crease: cool iron (≤ 80 °C) through brown paper, never steam on suede.</text><text class="n" x="0" y="355">Suede holds no sharp permanent crease: the edge-stitch holds the pleats, the crease stays soft.</text></g></g><g transform="translate(20,500)"><rect class="box" width="1200" height="440" rx="8"/><text class="t" x="18" y="32">C · WAISTBAND + FLY</text><text class="s" x="18" y="54">4.5 cm finished · hook + bar + inside button · metal zip #5</text><g transform="translate(40,70)"><rect class="w" x="0" y="6" width="26" height="9"/><text class="n" x="34" y="15">stone lamb suede 0.6–0.7 mm</text><rect class="ip" x="260" y="6" width="26" height="9"/><text class="n" x="294" y="15">woven fusible</text><rect class="pkt" x="410" y="6" width="26" height="9"/><text class="n" x="444" y="15">pocketing</text><rect class="lin" x="540" y="6" width="26" height="9"/><text class="n" x="574" y="15">cupro lining</text>
