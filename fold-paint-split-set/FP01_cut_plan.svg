ght="700" font-size="10" fill="#f4f3f0">4</text><text x="1458.0" y="202" font-family="Helvetica" font-size="12" fill="#222">2 × Back yoke, outer + inner · 62 × 17 · 2.3 sq ft</text><rect x="1434.0" y="212" width="16" height="16" rx="3" fill="#2f4170"/><text x="1442.0" y="225" text-anchor="middle" font-family="Helvetica" font-weight="700" font-size="10" fill="#f4f3f0">5</text><text x="1458.0" y="224" font-family="Helvetica" font-size="12" fill="#222">2 × Sleeve · 50 × 54 · 5.8 sq ft</text><rect x="1434.0" y="234" width="16" height="16" rx="3" fill="#2f4170"/><text x="1442.0" y="247" text-anchor="middle" font-family="Helvetica" font-weight="700" font-size="10" fill="#f4f3f0">6</text><text x="1458.0" y="246" font-family="Helvetica" font-size="12" fill="#222">2 × Front placket strip (folded double) · 9 × 72 · 1.4 sq ft</text><rect x="1434.0" y="256" width="16" height="16" rx="3" fill="#2f4170"/><text x="1442.0" y="269" text-anchor="middle" font-family="Helvetica" font-weight="700" font-size="10" fill="#f4f3f0">7</text><text x="1458.0" y="268" font-family="Helvetica" font-size="12" fill="#222">2 × Collar, upper + under · 50 × 9 · 1.0 sq ft</text><rect x="1434.0" y="278" width="16" height="16" rx="3" fill="#2f4170"/><text x="1442.0" y="291" text-anchor="middle" font-family="Helvetica" font-weight="700" font-size="10" fill="#f4f3f0">8</text><text x="1458.0" y="290" font-family="Helvetica" font-size="12" fill="#222">2 × Collar stand, outer + inner · 49 × 5.5 · 0.6 sq ft</text><rect x="1434.0" y="300" width="16" height="16" rx="3" fill="#2f4170"/><text x="1442.0" y="313" text-anchor="middle" font-family="Helvetica" font-weight="700" font-size="10" fill="#f4f3f0">9</text><text x="1458.0" y="312" font-family="Helvetica" font-size="12" fill="#222">2 × Cuff (folded: outer + inner in one) · 28 × 14 · 0.8 sq ft</text><rect x="1434.0" y="322" width="16" height="16" rx="3" fill="#2f4170"/><text x="1442.0" y="335" text-anchor="middle" font-family="Helvetica" font-weight="700" font-si